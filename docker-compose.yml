services:
  db:
    image: postgres:16-alpine
    container_name: vierra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vierra
      POSTGRES_PASSWORD: vierra
      POSTGRES_DB: vierra
    ports:
      - "1832:5432"
    volumes:
      - vierra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vierra -d vierra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vierra-db-data:
